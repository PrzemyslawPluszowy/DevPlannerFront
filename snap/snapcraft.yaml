name: ready_next
version: 1.0.0
summary: Generated by Icons Launcher
description: Generated by Icons Launcher package for Linux.

confinement: strict
base: core22
grade: stable

slots:
  dbus-ready_next: # adjust accordingly to your app name
    interface: dbus
    bus: session
    name: org.bar.ready_next # adjust accordingly to your app name

apps:
  ready_next:
    command: ready_next
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
    - network
    slots:
      - dbus-ready_next
parts:
  ready_next:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart # The main entry-point file of the application
