name: devplanner
version: 1.0.0
summary: Generated by Icons Launcher
description: Generated by Icons Launcher package for Linux.

confinement: strict
base: core22
grade: stable

slots:
  dbus-devplanner: # adjust accordingly to your app name
    interface: dbus
    bus: session
    name: org.excellent.devplanner # adjust accordingly to your app name

apps:
  devplanner:
    command: devplanner
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
    - network
    slots:
      - dbus-devplanner
parts:
  devplanner:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart # The main entry-point file of the application
